<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Week 9 - Media Queries in CSS</title>
</head>
<body>
    <div class="container">
        <!-- prompt to set up structure: inside container, add header, main, footer -->
        <header>
            <!-- only one h1 on a site -->
            <h1>Week 9 - Media Queries in CSS</h1>
            <!-- ai prompt: in the header, under the h1, add a nav. in that nav, the navigation should be structured in a ul, with four blank links (using a #) for home, about, stuff and contact -->
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Stuff</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <article>
                <h3>Stuff About Kittens</h3>
                <!-- ai prompt: in the article under h3, add two paragraphs with placeholder content about kittens-->
                <p>Kittens are playful little cats who enjoy exploring their surroundings and chasing toys.</p>
                <p>With gentle care, cozy places to rest, and plenty of affection, kittens grow into happy companions.</p>
            </article>
        </main>
        <footer></footer>
    </div>   
</body>
</html>
